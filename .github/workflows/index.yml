# Keeps cases/index.json in step with the flowsheets under cases/: DWSIM's welcome screen reads it.
name: Case index

on:
  push:
    branches: [main]
    paths:
      - 'cases/**'
      - '!cases/index.json'
      - '.github/scripts/build_index.py'
      - '.github/workflows/index.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: case-index
  cancel-in-progress: false

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the index
        run: python3 .github/scripts/build_index.py
      - name: Commit the index when it changed
        run: |
          if [ -z "$(git status --porcelain -- cases/index.json)" ]; then
            echo "The index is up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cases/index.json
          git commit -m "cases/index.json: regenerate"
          git push
